# Plugin dependencies
dependencies:
  - id: packetevents
    name: PacketEvents
    type: required
    url: https://github.com/retrooper/packetevents
  - id: worldguard
    name: WorldGuard
    type: optional
    url: https://enginehub.org/worldguard/
  - id: placeholderapi
    name: PlaceholderAPI
    type: optional
    url: https://placeholderapi.com/
  - id: vault
    name: Vault
    type: optional
    url: https://github.com/MilkBowl/VaultAPI

# External links
links:
  github: https://github.com/Cypherlink-Studios/Croppy
  discord: https://discord.gg/j7ZTRXmQG4

# Documentation engine metadata
documentation:
  defaultLocale: en
  locales:
    - es
    - en
