id: croppy
name: Croppy
description: Modular simulation engine for dynamic agriculture, soil nutrients, cooking workstations, variable heat sources, and culinary recipes on Paper.

# Supported platforms
platforms:
  - paper
  - purpur

# Minecraft compatibility
minecraft:
  minimum: "1.21.8"
  supported:
    - "1.21.x"
  tested: "1.21.8"

# Java Runtime compatibility
java:
  minimum: 21
  recommended: 21

# Folia support
folia:
  supported: false
  status: unsupported
  notes: Utilizes synchronized Bukkit/Paper scheduling for physical block interactions and PacketEvents without Folia regional threading support.

# Published releases
versions:
  # -------------------------------------------------------------
  # CURRENT VERSION (LATEST) -> Always index 0
  # -------------------------------------------------------------
  - version: "0.5.2"
    releaseDate: "2026-11-05"
    reference: "main"
    downloadUrl: https://github.com/Cypherlink-Studios/Croppy/releases
    changelog: "Modernized config.yml with locale.default and purged legacy sections; multi-block crop vertical occupancy & harvest regrowth; companion resource pack scaffolding (pack_format 64)."
    minecraft:
      - "1.21.x"

  # -------------------------------------------------------------
