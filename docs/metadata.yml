  - version: "0.7.0"
    releaseDate: "2026-11-11"
    reference: "main"
    downloadUrl: https://github.com/Cypherlink-Studios/Croppy/releases
    changelog: "Unified line-of-sight crop raytracing (CropTargetResolver) across /croppy inspect, water, fertilize, setstage, and setprogress to target virtual 3D Interaction entity hitboxes, physical blocks, and supporting farmland with solid-block occlusion; routed virtual Interaction entity right-clicks with croppy:inspection_tool directly to read-only inspection cards (even inside protected regions); and refreshed the companion resource pack icon."
    minecraft:
      - "1.21.x"

