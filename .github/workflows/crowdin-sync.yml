name: Crowdin Translation Synchronization

on:
  push:
    branches: [ "main" ]
    paths:
      - 'croppy-paper/src/main/resources/locales/**'
      - 'crowdin.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  synchronize-with-crowdin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Crowdin Action
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: true
          download_translations: true
          localization_branch_name: l10n_crowdin_translations
          create_pull_request: true
          pull_request_title: 'l10n: New Crowdin Translations'
          pull_request_body: 'Automated pull request generated by Crowdin Action with latest community translations.'
          commit_message: 'l10n: Synchronize translations from Crowdin [skip ci]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
