name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or version to release (e.g. v0.5.9). If omitted, inferred from ref or project version.'
        required: false
        type: string
      draft:
        description: 'Publish as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Version and Tag
        id: vars
        run: |
          # Extract project version from Gradle
          GRADLE_VERSION=$(./gradlew properties --property version -q | grep '^version:' | awk '{print $2}')
          echo "gradle_version=${GRADLE_VERSION}" >> "$GITHUB_OUTPUT"

          # Resolve target tag
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${GRADLE_VERSION}"
          fi

          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Safety check: Validate consistency between target tag and Gradle project version
          if [ "${VERSION}" != "${GRADLE_VERSION}" ]; then
            echo "::error::Version mismatch! Target tag specifies '${VERSION}', but build.gradle.kts defines '${GRADLE_VERSION}'."
            exit 1
          fi

      - name: Run verification test suites
        run: ./gradlew check test --info

      - name: Build Plugin and API JARs
        run: ./gradlew :croppy-paper:shadowJar :croppy-api:jar

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          VERSION="${{ steps.vars.outputs.version }}"

          # Stage Plugin JAR
          cp "croppy-paper/build/libs/Croppy-paper-${VERSION}.jar" "release-assets/Croppy-${VERSION}.jar"

          # Stage API JAR
          cp "croppy-api/build/libs/croppy-api-${VERSION}.jar" "release-assets/croppy-api-${VERSION}.jar"

          # Package Companion Resource Pack (pack.mcmeta at the root of the ZIP)
          (cd resourcepack && zip -r "../release-assets/Croppy-ResourcePack-${VERSION}.zip" ./*)

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum Croppy-* croppy-api-* > checksums-sha256.txt
          sha1sum Croppy-* croppy-api-* > checksums-sha1.txt
          echo "SHA-256 Checksums:"
          cat checksums-sha256.txt
          echo "SHA-1 Checksums:"
          cat checksums-sha1.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Croppy v${{ steps.vars.outputs.version }}"
          files: |
            release-assets/Croppy-${{ steps.vars.outputs.version }}.jar
            release-assets/croppy-api-${{ steps.vars.outputs.version }}.jar
            release-assets/Croppy-ResourcePack-${{ steps.vars.outputs.version }}.zip
            release-assets/checksums-sha256.txt
            release-assets/checksums-sha1.txt
          generate_release_notes: true
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || contains(steps.vars.outputs.tag, '-alpha') || contains(steps.vars.outputs.tag, '-beta') || contains(steps.vars.outputs.tag, '-rc') }}
