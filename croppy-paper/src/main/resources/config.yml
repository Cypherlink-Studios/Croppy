# ==============================================================================
# Croppy - Advanced Modular Agriculture Engine Configuration
# ==============================================================================

# Simulation & Growth Engine Settings
growth:
  # Frequency of simulation cycles in server ticks (20 ticks = 1 second)
  tick-interval: 20

  # Base progress percentage gained each cycle when all conditions are satisfied
  base-progress: 1.0

  # Horizontal search radius in blocks for detecting water sources (4 blocks = 9x9 area)
  water-search-radius: 4

# Persistent Storage Backend
storage:
  # Storage engine backend type:
  # - "pdc" (default, recommended): Uses Minecraft's native Chunk PersistentDataContainer.
  #   Zero extra dependencies, ultra-compact binary format, perfectly synced with world chunks.
  #
  # - "sqlite": Uses an embedded SQLite database with HikariCP connection pooling.
  #   Drivers are downloaded dynamically via Libby on first boot if this mode is selected.
  type: "pdc"

  sqlite:
    # SQLite database file name (located inside the plugin data folder)
    file: "crops.db"
    pool:
      # Maximum active connections in the HikariCP connection pool
      maximum-pool-size: 5
      # Connection timeout in milliseconds
      connection-timeout: 30000

# Localization & Language Settings
locale:
  # Default server locale when a player's client language is unavailable or for console logs.
  # Bundled locales: en-US, es-ES (see plugins/Croppy/locales/)
  default: "en-US"

# ==============================================================================
# Third-Party Plugin Integrations
# ==============================================================================
integrations:
  worldguard:
    # Enables land claim and region protection checks via WorldGuard
    enabled: true
    # Registers custom WorldGuard flags (croppy-plant, croppy-harvest, croppy-water, croppy-fertilize, croppy-cook)
    use-custom-flags: true

  papi:
    # Enables PlaceholderAPI expansion for live telemetry
    enabled: true
    # Maximum raycast distance in blocks to resolve targeted crops and workstations
    raycast-distance: 5

  vault:
    # Enables currency operations and transaction validations via Vault
    enabled: true

# ==============================================================================
# Companion Resource Pack & Delivery Pipeline
# ==============================================================================
resource-pack:
  embedded-server:
    # Whether to host the unified companion resource pack via an embedded HTTP server
    enabled: true
    # Listening network interface (0.0.0.0 binds to all available interfaces)
    host: "0.0.0.0"
    # HTTP server listening port
    port: 8085
    # Optional public URL override (e.g., "http://play.myserver.com:8085/pack/croppy-unified-pack.zip").
    # If left blank, Croppy automatically discovers the host address and port.
    public-url: ""

  delivery:
    # Automatically prompt players to download the resource pack upon joining the server
    auto-send-on-join: true
    # Whether the resource pack is mandatory to play (if true, declining kicks the player)
    required: false
    # MiniMessage formatted prompt shown in the client's resource pack confirmation screen
    prompt: "<gradient:#70e000:#38b000><bold>Croppy</bold></gradient> <dark_gray>» <gray>Please download the 3D companion pack to see custom crops and stations.</gray>"

# ==============================================================================
# Automatic Update Checker & Stager
# ==============================================================================
updates:
  # Enables the update checking and staging subsystem
  enabled: true

  # Asynchronously checks for updates during server boot and logs results to console
  check-on-startup: true

  # Release channel to track:
  # - "STABLE": Only official production releases
  # - "BETA": Includes experimental tags (-alpha, -beta, -rc)
  channel: "STABLE"

# ==============================================================================
# Culinary Compendium (Cookbook) Configuration
# ==============================================================================
compendium:
  # Whether undiscovered recipes without hints appear in the compendium as "???" placeholders
  show-unknown-recipes: true

  # Whether clicking a discovered recipe opens the step-by-step cooking inspection menu
  enable-detail-view: true

  # Maximum horizontal/vertical distance in blocks to consider a player near a compatible station
  station-proximity-distance: 5

# ==============================================================================
# Vanilla Crafting Table Integration
# ==============================================================================
crafting:
  # Automatically unlocks all registered Croppy crafting recipes in player recipe books upon join
  auto-discover-recipes: true

