id: "croppy:cooking_pot"
title: "<gradient:#ffaa00:#ff5555>Cooking Pot</gradient>"
rows: 4
pattern:
  - "X X X X X X X X X"
  - "X I I I X X X O X"
  - "X I I I X S X O X"
  - "X X X X B X X X X"
elements:
  'X':
    type: DECORATION
    item:
      material: "minecraft:gray_stained_glass_pane"
      name: " "
  'I':
    type: INPUT
  'O':
    type: OUTPUT
  'S':
    type: STATUS
    item:
      material: "minecraft:cauldron"
      name: "<gray>Cooking Pot: <italic>Idle</italic></gray>"
      lore:
        - "<dark_gray>Place ingredients and ignite.</dark_gray>"
    states:
      - condition: "process.state == 'RUNNING'"
        item:
          material: "minecraft:campfire"
          name: "<gold><bold>Cooking...</bold></gold>"
          lore:
            - "<yellow>Recipe:</yellow> <white>{recipe.name}</white>"
            - "<yellow>Progress:</yellow> <aqua>{process.progress_percent}%</aqua>"
            - "<yellow>Time Left:</yellow> <white>{process.remaining_seconds}s</white>"
            - "<yellow>Heat:</yellow> <white>{station.heat_level}°C</white>"
          glow: true
      - condition: "process.state == 'COMPLETED'"
        item:
          material: "minecraft:bell"
          name: "<green><bold>Cooking Complete!</bold></green>"
          lore:
            - "<gray>Collect your culinary dish.</gray>"
      - condition: "process.state == 'STALLED'"
        item:
          material: "minecraft:barrier"
          name: "<red><bold>Cooking Stalled!</bold></red>"
          lore:
            - "<gray>Station requires heat underneath!</gray>"
  'B':
    type: ACTION
    item:
      material: "minecraft:flint_and_steel"
      name: "<yellow><bold>Ignite Cookware</bold></yellow>"
      lore:
        - "<gray>Click to start the cooking process.</gray>"
    actions:
      - click: LEFT
        type: STATION_ACTION
        action: "START_PROCESS"
      - click: LEFT
        type: SOUND
        sound: "minecraft:item.flintandsteel.use"
