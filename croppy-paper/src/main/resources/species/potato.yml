id: "croppy:potato"
name: "Patata"

display:
  type: "vanilla"
  block: "minecraft:potatoes"
  seed_item: "minecraft:potato"

stages:
  - id: "seed"
    progress_required: 100
    display:
      block_age: 0
  - id: "sprout"
    progress_required: 100
    display:
      block_age: 2
  - id: "growing"
    progress_required: 150
    display:
      block_age: 5
  - id: "mature"
    progress_required: 0
    display:
      block_age: 7

requirements:
  min_light: 9
  water_fluid_level: 1

harvest:
  yield:
    - item: "minecraft:potato"
      min: 1
      max: 4
