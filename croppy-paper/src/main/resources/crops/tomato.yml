id: "croppy:tomato"
name: "<red>Tomato</red>"

display:
  type: "model_3d"
  base_block: "minecraft:air"
  rotation_mode: "RANDOM_JITTER"
  seed_item: "croppy:tomato_seeds"

stages:
  - id: "seed"
    progress_required: 50
    model:
      item_model: "croppy:plant/tomato/stage_0"
      scale: [1.0, 1.0, 1.0]
      translation: [0.0, 0.0, 0.0]
      hitbox:
        width: 0.6
        height: 0.3
  - id: "sprout"
    progress_required: 100
    model:
      item_model: "croppy:plant/tomato/stage_1"
      scale: [1.0, 1.0, 1.0]
      translation: [0.0, 0.0, 0.0]
      hitbox:
        width: 0.7
        height: 0.6
  - id: "mature"
    progress_required: 0
    model:
      item_model: "croppy:plant/tomato/stage_2"
      scale: [1.0, 1.0, 1.0]
      translation: [0.0, 0.0, 0.0]
      hitbox:
        width: 0.8
        height: 0.9

requirements:
  min_light: 9
  water_fluid_level: 1

harvest:
  yield:
    - item: "croppy:tomato"
      min: 1
      max: 3
    - item: "croppy:tomato_seeds"
      min: 1
      max: 2
