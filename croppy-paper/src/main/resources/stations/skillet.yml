id: "croppy:skillet"
name: "<gradient:#ffaa00:#ff3300>Skillet</gradient>"
block: "minecraft:barrier"
interaction: "PHYSICAL"
input_capacity: 4
output_capacity: 2
menu: "croppy:skillet"
has_display: true
visual:
  hide_base_block: true
  interaction:
    width: 1.01
    height: 0.30
  base_model:
    enabled: true
    type: "ITEM"
    item: "croppy:skillet"
    translation: [0.0, 0.5, 0.0]
    rotation_pitch: 0.0
    scale: [1.2, 1.0, 1.2]
    view_distance: 48
  process_display:
    enabled: true
    type: "ITEM"
    translation: [0.0, 0.12, 0.0]
    rotation_pitch: 90.0
    scale: [0.45, 0.45, 0.45]
    view_distance: 24
    interpolation_duration: 2
  text_display:
    enabled: true
    translation: [0.0, 1.15, 0.0]
    billboard: "FIXED"
    view_distance: 8
    line_width: 220
    format: |
      <gradient:#ffaa00:#ff3300><bold>{recipe_name}</bold></gradient>
      {progress_bar} <white>{progress_percent}%</white>
      <gray>Temp: <gold>{temperature_c}</gold> (<yellow>{thermal_zone}</yellow>)</gray>

states:
  - id: "sizzling"
    priority: 20
    when: "temperature >= 120.0 && has_inputs == true"
    model:
      item_model: "croppy:station/skillet/hot"
      translation: [0.0, 0.5, 0.0]
      rotation_pitch: 0.0
      scale: [1.2, 1.0, 1.2]
    effects:
      particle:
        type: "SMOKE"
        count: 2
        offset: [0.1, 0.15, 0.1]
        speed: 0.01
      sound:
        sound: "block.fire.extinguish"
        interval_ticks: 35
        volume: 0.3
        pitch: 1.5
  - id: "idle"
    priority: 0
    model:
      item_model: "croppy:skillet"
      translation: [0.0, 0.5, 0.0]
      rotation_pitch: 0.0
      scale: [1.2, 1.0, 1.2]

properties:
  thermal: "true"
  has_thermal: "true"
